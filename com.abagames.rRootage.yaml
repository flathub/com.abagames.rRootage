app-id: com.abagames.rRootage
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: run-rrootage.sh
rename-desktop-file: rrootage.desktop
rename-icon: rrootage
rename-appdata-file: rrootage.appdata.xml
finish-args:
  - --device=dri
  - --share=ipc
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=x11
modules:
  - shared-modules/glu/glu-9.json
  - shared-modules/SDL/SDL-1.2.15.json
  - shared-modules/SDL/SDL_mixer-1.2.12.json
  - name: bulletml
    buildsystem: simple
    build-commands:
      - rm -f src/calc.cpp
      - rm -f src/*.o src/*/*.o
      - make -C src CXXFLAGS="$(CXXFLAGS) $(CPPFLAGS)" libbulletml.a
      - rm -f src/*.o src/*/*.o
      - make -C src CXXFLAGS="$(CXXFLAGS) $(CPPFLAGS) -fPIC -fpic" LDFLAGS="$(LDFLAGS)
        -Wl,-z,defs" libbulletml.so
      - mkdir -p /app/include/d/ /app/include/bulletml/ /app/include/bulletml/tinyxml/
        /app/lib
      - cp src/bulletml.d /app/include/d/
      - cp src/*.h /app/include/bulletml/
      - cp src/tinyxml/*.h /app/include/bulletml/tinyxml/
      - cp src/lib*.a /app/lib/
      - cp -a src/lib*.so* /app/lib/
    cleanup:
      - /app/include
      - '*.a'
    sources:
      - type: archive
        url: http://http.debian.net/debian/pool/main/b/bulletml/bulletml_0.0.6.orig.tar.gz
        sha256: 162544e708cd8f61c944f7eac2a0403d2900d29fa9b1dc45235cfccfac8ae960
      - type: patch
        paths:
          - patches/bulletml/fixes.patch
          - patches/bulletml/bulletml_d.patch
          - patches/bulletml/d_cpp.patch
          - patches/bulletml/warnings.patch
          - patches/bulletml/makefile.patch
          - patches/bulletml/includes.patch
          - patches/bulletml/get-rid-of-boost.patch

  - name: rrootage
    buildsystem: simple
    build-commands:
      - CC=clang;make -C src -f makefile.lin MORE_CFLAGS="-DLINUX -std=gnu17 -Wall -g"
      - install src/rrootage /app/bin/rrootage
      - install -m 555 run-rrootage.sh /app/bin/run-rrootage.sh
      - install -d /app/share/games/rRootage
      - cp -R rr_share/* /app/share/games/rRootage
    post-install:
      - install -Dm644 rrootage.png -t /app/share/icons/hicolor/64x64/apps/
      - install -Dm644 rrootage-128.png /app/share/icons/hicolor/128x128/apps/rrootage.png
      - install -Dm644 rrootage.desktop -t /app/share/applications/
      - install -Dm644 rrootage.appdata.xml -t /app/share/metainfo/
    sources:
      - type: archive
        url: https://master.dl.sourceforge.net/project/rrootage/rRootage%20binary_source/rRootage%200.23a/rRootage-0.23a.tar.gz
        sha256: 964edbe21802e3e40d6a8da19b61132decacd13bf9a71bac86abce012379ff07
      - type: patch
        paths:
          - patches/rrootage/01_makefile.patch
          - patches/rrootage/02_data_dir.patch
          - patches/rrootage/03_texture_filename.patch
          - patches/rrootage/04_home.patch
          - patches/rrootage/05_gcc.patch
          - patches/rrootage/06_rrootage_highres.patch
          - patches/rrootage/07_use_system_bulletml.patch
          - patches/rrootage/08_windowed_mode.patch
          - patches/rrootage/09_rootage_make_highres_default.patch
          - patches/rrootage/10_deg_out_of_range.patch
          - patches/rrootage/11-Do-not-hardcode-the-assets-location.patch
      - type: file
        path: rrootage.desktop
      - type: file
        path: rrootage.png
      - type: file
        path: rrootage-128.png
      - type: file
        path: rrootage.appdata.xml
      - type: script
        dest-filename: run-rrootage.sh
        commands:
          - HOME=$XDG_CONFIG_HOME /app/bin/rrootage

